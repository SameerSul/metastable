# Tiny Tapeout project information
project:
  title:        "Metastable: programmable protocol emulator"
  author:       "Sameer Suleman"
  discord:      ""
  description:  "Dual PIO-style programmable state machines for bit-banging UART/SPI/I2C and more, with SPI host interface"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_sulems6_metastable"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "spi_slave.v"
    - "pio_sm.v"
    - "pio_fifo.v"
    - "pio_clkdiv.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "SPI_SCK"
  ui[1]: "SPI_CS_N"
  ui[2]: "SPI_MOSI"
  ui[3]: "GPIO8 (in only)"
  ui[4]: "GPIO9 (in only)"
  ui[5]: "GPIO10 (in only)"
  ui[6]: "GPIO11 (in only)"
  ui[7]: "GPIO12 (in only)"

  # Outputs
  uo[0]: "SPI_MISO"
  uo[1]: "HOST_IRQ"
  uo[2]: "GPIO13 (out only)"
  uo[3]: "GPIO14 (out only)"
  uo[4]: "GPIO15 (out only)"
  uo[5]: "DBG_SM0_STALL"
  uo[6]: "DBG_SM1_STALL"
  uo[7]: "HEARTBEAT"

  # Bidirectional pins
  uio[0]: "GPIO0"
  uio[1]: "GPIO1"
  uio[2]: "GPIO2"
  uio[3]: "GPIO3"
  uio[4]: "GPIO4"
  uio[5]: "GPIO5"
  uio[6]: "GPIO6"
  uio[7]: "GPIO7"

# Do not change!
yaml_version: 6
